# Airflow on your machine, with Dyalog APL inside it.
#   integrations/scheduling/airflow/airflow.sh up      (builds the image, starts this)
#   then open http://localhost:8088
#
# Two containers:
#   postgres  Airflow's database (DAG runs, task states, logs index)
#   airflow   `airflow standalone`: scheduler, DAG processor, triggerer and the
#             web UI/API in one container, running tasks with LocalExecutor
#
# For local learning only: no login (everyone is admin), and the ports are
# bound to 127.0.0.1 so nothing outside this computer can reach them.
name: apl-airflow

services:
  postgres:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  airflow:
    image: localhost/apl-airflow:latest
    build: .
    command: standalone
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8088}:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"   # no login: local use only
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "15"           # notice new DAG files quickly
      # read by the DAGs and the APL job
      APL_REPO: /apl
      REPORT_DIR: /apl-output/reports
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ../../..:/apl:ro                  # the whole repo, read-only: any .apls can be scheduled
      - ../output:/apl-output             # reports land in integrations/scheduling/output/
      - airflow-logs:/opt/airflow/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      retries: 30
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-db:
  airflow-logs:
