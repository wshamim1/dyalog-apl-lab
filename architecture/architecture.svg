<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1150" viewBox="0 0 1150 1020" role="img" aria-label="One Dyalog interpreter runs in a container. A terminal connects to its session; RIDE and the Python dyalog_ride client connect to its RIDE server on TCP 4502; HTTP clients call Jarvis, which runs inside the workspace and calls your code; SQAPL inside the workspace reaches MySQL over ODBC; the repo folder is mounted at /app.">
          <defs>
            <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
            <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-hot" d="M0,0 L10,5 L0,10 z"/></marker>
          </defs>
<style>
  svg { color: #1d2430; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .region { fill: none; stroke: #9aa3b2; stroke-width: 1.5; stroke-dasharray: 6 5; }
  .interp { fill: #e3f1f6; stroke: #0e6f8f; stroke-width: 1.5; }
  .ws { fill: #ffffff; stroke: #0e6f8f; stroke-width: 1; stroke-dasharray: 4 4; }
  .box { fill: #ffffff; stroke: #1d2430; stroke-width: 1.2; }
  .door { fill: #ffffff; stroke: #0e6f8f; stroke-width: 1.6; }
  .hotbox { fill: #fbeee4; stroke: #b4531a; stroke-width: 1.8; }
  .t { font-size: 13px; font-weight: 600; fill: #1d2430; }
  .s { font-size: 11px; fill: #5d6676; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .lab { font-size: 11px; fill: #5d6676; }
  .regionlab { font-size: 12px; font-weight: 600; fill: #5d6676; letter-spacing: 0.04em; }
  .corelab { font-size: 12px; font-weight: 600; fill: #0e6f8f; letter-spacing: 0.04em; }
  .wire { fill: none; stroke: #1d2430; stroke-width: 1.4; }
  .wire.hot { stroke: #b4531a; stroke-width: 2; }
  .hotlab { font-size: 11px; font-weight: 600; fill: #b4531a; }
  .ah { fill: #1d2430; }
  .ah-hot { fill: #b4531a; }
  @media (prefers-color-scheme: dark) {
    svg { color: #e3e8f0; }
    .region { stroke: #5a6474; }
    .interp { fill: #15303b; stroke: #5cc0de; }
    .ws, .box, .door { fill: #1a2029; }
    .ws, .door { stroke: #5cc0de; }
    .box { stroke: #e3e8f0; }
    .hotbox { fill: #3a2618; stroke: #f0a35f; }
    .t { fill: #e3e8f0; }
    .s, .lab, .regionlab { fill: #9aa4b5; }
    .corelab { fill: #5cc0de; }
    .wire { stroke: #e3e8f0; }
    .wire.hot { stroke: #f0a35f; }
    .hotlab { fill: #f0a35f; }
    .ah { fill: #e3e8f0; }
    .ah-hot { fill: #f0a35f; }
  }
</style>

          <text class="regionlab" x="40" y="40">YOUR MAC</text>

          <!-- Python tools at the top -->
          <rect class="box" x="700" y="30" width="160" height="56" rx="8"/>
          <text class="t" x="780" y="54" text-anchor="middle">Streamlit app</text>
          <text class="s" x="780" y="72" text-anchor="middle">web UI · :8501</text>

          <rect class="box" x="900" y="30" width="160" height="56" rx="8"/>
          <text class="t" x="980" y="54" text-anchor="middle">OpenAI API</text>
          <text class="s" x="980" y="72" text-anchor="middle">cloud</text>
          <path class="wire" d="M860,58 H898" marker-end="url(#a)"/>
          <text class="lab" x="879" y="50" text-anchor="middle">HTTPS</text>

          <rect class="box" x="540" y="130" width="170" height="56" rx="8"/>
          <text class="t" x="625" y="154" text-anchor="middle">RIDE</text>
          <text class="s" x="625" y="172" text-anchor="middle">IDE window</text>

          <rect class="box" x="730" y="130" width="170" height="56" rx="8"/>
          <text class="t" x="815" y="154" text-anchor="middle">dyalog_ride</text>
          <text class="s" x="815" y="172" text-anchor="middle">Python RIDE client</text>
          <path class="wire" d="M780,86 V128" marker-end="url(#a)"/>
          <text class="lab" x="788" y="111">uses</text>

          <rect class="box" x="950" y="130" width="160" height="56" rx="8"/>
          <text class="t" x="1030" y="154" text-anchor="middle">MySQL bridge</text>
          <text class="s" x="1030" y="172" text-anchor="middle">Python · PyMySQL</text>
          <path class="wire" d="M950,158 H902" marker-end="url(#a)"/>
          <text class="lab" x="926" y="150" text-anchor="middle">uses</text>

          <!-- Container and interpreter -->
          <rect class="region" x="340" y="220" width="540" height="760" rx="14"/>
          <text class="regionlab" x="356" y="244">CONTAINER · IN PODMAN'S LINUX VM</text>
          <rect class="interp" x="358" y="262" width="494" height="700" rx="12"/>
          <text class="corelab" x="374" y="950">DYALOG APL 21 · THE INTERPRETER (CORE)</text>

          <!-- RIDE protocol into the RIDE server door -->
          <path class="wire" d="M630,186 V288" marker-end="url(#a)"/>
          <path class="wire" d="M800,186 V288" marker-end="url(#a)"/>
          <text class="lab" x="715" y="240" text-anchor="middle">RIDE protocol · TCP 4502</text>

          <!-- Doors -->
          <rect class="door" x="378" y="290" width="200" height="56" rx="8"/>
          <text class="t" x="478" y="314" text-anchor="middle">session</text>
          <text class="s" x="478" y="332" text-anchor="middle">or dyalogscript (.apls)</text>
          <rect class="door" x="618" y="290" width="220" height="56" rx="8"/>
          <text class="t" x="728" y="314" text-anchor="middle">RIDE server</text>
          <text class="s" x="728" y="332" text-anchor="middle">RIDE_INIT=SERVE · 4502</text>

          <!-- Terminal into the session -->
          <rect class="box" x="40" y="290" width="200" height="56" rx="8"/>
          <text class="t" x="140" y="314" text-anchor="middle">Terminal</text>
          <text class="s" x="140" y="332" text-anchor="middle">dyalog · dyalog FILE</text>
          <path class="wire" d="M240,318 H376" marker-end="url(#a)"/>
          <text class="lab" x="290" y="310" text-anchor="middle">stdin / stdout</text>

          <!-- Doors into the workspace -->
          <path class="wire" d="M478,346 V398" marker-end="url(#a)"/>
          <path class="wire" d="M728,346 V398" marker-end="url(#a)"/>
          <text class="lab" x="603" y="377" text-anchor="middle">both run APL in the workspace</text>

          <!-- Workspace -->
          <rect class="ws" x="378" y="400" width="460" height="510" rx="10"/>
          <text class="lab" x="394" y="422">workspace · everything loaded lives here</text>

          <rect class="box" x="400" y="440" width="170" height="80" rx="8"/>
          <text class="t" x="485" y="474" text-anchor="middle">your code</text>
          <text class="s" x="485" y="494" text-anchor="middle">.aplf · .apln · .aplc</text>

          <rect class="box" x="640" y="440" width="176" height="80" rx="8"/>
          <text class="t" x="728" y="474" text-anchor="middle">SQAPL</text>
          <text class="s" x="728" y="494" text-anchor="middle">ODBC · sqapl.dws</text>
          <path class="wire" d="M570,476 H638" marker-end="url(#a)"/>
          <text class="lab" x="604" y="468" text-anchor="middle">calls</text>

          <rect class="hotbox" x="400" y="690" width="170" height="80" rx="8"/>
          <text class="t" x="485" y="724" text-anchor="middle">Jarvis</text>
          <text class="s" x="485" y="744" text-anchor="middle">HTTP server, in APL</text>
          <path class="wire hot" d="M450,688 V522" marker-end="url(#ah)"/>
          <text class="hotlab" x="458" y="652">calls Name ⍵</text>

          <rect class="box" x="640" y="690" width="176" height="80" rx="8"/>
          <text class="t" x="728" y="724" text-anchor="middle">Tester</text>
          <text class="s" x="728" y="744" text-anchor="middle">dyalog test</text>
          <path class="wire" d="M728,688 V600 H540 V522" marker-end="url(#a)"/>
          <text class="lab" x="634" y="592" text-anchor="middle">loads + checks</text>

          <!-- HTTP clients into Jarvis -->
          <rect class="box" x="40" y="690" width="200" height="56" rx="8"/>
          <text class="t" x="140" y="714" text-anchor="middle">HTTP clients</text>
          <text class="s" x="140" y="732" text-anchor="middle">curl · Python · JS</text>
          <path class="wire hot" d="M240,718 H398" marker-end="url(#ah)"/>
          <text class="hotlab" x="290" y="708" text-anchor="middle">POST :8080</text>

                    <!-- Kafka: client inside the workspace, broker in its own container -->
          <rect class="box" x="640" y="800" width="176" height="80" rx="8"/>
          <text class="t" x="728" y="834" text-anchor="middle">Kafka client</text>
          <text class="s" x="728" y="854" text-anchor="middle">librdkafka · Kafka.apln</text>
          <rect class="region" x="910" y="790" width="230" height="100" rx="12"/>
          <text class="regionlab" x="926" y="812">KAFKA CONTAINER</text>
          <rect class="box" x="930" y="822" width="190" height="56" rx="8"/>
          <text class="t" x="1025" y="846" text-anchor="middle">Kafka broker</text>
          <text class="s" x="1025" y="864" text-anchor="middle">topics: orders · stats</text>
          <path class="wire" d="M816,850 H928" marker-start="url(#a)" marker-end="url(#a)"/>
          <text class="lab" x="899" y="842" text-anchor="middle">:19092</text>

          <!-- Jupyter: a separate container with its own Dyalog -->
          <rect class="box" x="40" y="770" width="260" height="44" rx="8"/>
          <text class="t" x="170" y="790" text-anchor="middle">Browser</text>
          <text class="s" x="170" y="806" text-anchor="middle">notebooks UI</text>
          <rect class="region" x="20" y="830" width="300" height="180" rx="12"/>
          <text class="regionlab" x="36" y="852">JUPYTER CONTAINER</text>
          <rect class="box" x="40" y="862" width="260" height="50" rx="8"/>
          <text class="t" x="170" y="882" text-anchor="middle">JupyterLab + Dyalog kernel</text>
          <text class="s" x="170" y="899" text-anchor="middle">notebooks/ · :8888</text>
          <rect class="interp" x="40" y="946" width="260" height="50" rx="8"/>
          <text class="t" x="170" y="966" text-anchor="middle">its own Dyalog APL 21</text>
          <text class="s" x="170" y="983" text-anchor="middle">runs the notebook cells</text>
          <path class="wire" d="M250,814 V860" marker-end="url(#a)"/>
          <text class="lab" x="258" y="848">:8888</text>
          <path class="wire" d="M250,912 V944" marker-end="url(#a)"/>
          <text class="lab" x="258" y="933">RIDE</text>

          <!-- Right side: MySQL and the repo folder -->
          <rect class="box" x="930" y="440" width="190" height="56" rx="8"/>
          <text class="t" x="1025" y="464" text-anchor="middle">MySQL</text>
          <text class="s" x="1025" y="482" text-anchor="middle">on your Mac · :3307</text>
          <path class="wire" d="M816,476 H928" marker-end="url(#a)"/>
          <text class="lab" x="900" y="468" text-anchor="middle">ODBC</text>
          <path class="wire" d="M1030,186 V438" marker-end="url(#a)"/>
          <text class="lab" x="1038" y="320">PyMySQL</text>

          <rect class="box" x="930" y="600" width="190" height="56" rx="8"/>
          <text class="t" x="1025" y="624" text-anchor="middle">repo folder</text>
          <text class="s" x="1025" y="642" text-anchor="middle">mounted at /app</text>
          <path class="wire" d="M930,628 H840" marker-end="url(#a)"/>
          <text class="lab" x="900" y="620" text-anchor="middle">files</text>
        </svg>
